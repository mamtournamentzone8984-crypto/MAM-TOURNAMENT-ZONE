<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    background:#0b1020;
    color:white;
    font-family:Arial;
    padding:30px;
}
.box{
    max-width:400px;
    margin:50px auto;
    background:#151d38;
    padding:25px;
    border-radius:15px;
}
input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #334;
    background:#080d1c;
    color:white;
}
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#1677ff;
    color:white;
    font-weight:bold;
}
#result{
    margin-top:20px;
    padding:12px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 MAM ADMIN LOGIN</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="login">LOGIN</button>

<div id="result">Login চাপুন</div>

</div>

<script>

const URL =
"https://qskpvywtzageshrqenlz.supabase.co";

const KEY =
"sb_publishable_yqi_zggCenxo5y7Rdugutg_eibJ5-uc";

const ADMIN =
"d1c467af-9a20-47b1-ae63-164dd55bc8c0";


const client =
window.supabase.createClient(URL, KEY);


document.getElementById("login").onclick =
async function(){

    const result =
    document.getElementById("result");

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    result.innerText =
    "⏳ Login হচ্ছে...";

    try{

        const response =
        await client.auth.signInWithPassword({
            email: email,
            password: password
        });

        console.log(response);

        if(response.error){

            result.innerText =
            "❌ ERROR:\n\n" +
            response.error.message;

            return;
        }

        const user =
        response.data.user;

        if(!user){

            result.innerText =
            "❌ User পাওয়া যায়নি";

            return;
        }

        if(user.id !== ADMIN){

            result.innerText =
            "❌ এই User Admin নয়\n\n" +
            "User ID:\n" +
            user.id +
            "\n\nAdmin ID:\n" +
            ADMIN;

            return;
        }

        result.innerText =
        "✅ LOGIN SUCCESS!\n\n" +
        "ADMIN VERIFIED\n\n" +
        "User ID:\n" +
        user.id;

    }catch(error){

        result.innerText =
        "❌ JAVASCRIPT ERROR:\n\n" +
        error.message;

    }

};

</script>

</body>
</html>
